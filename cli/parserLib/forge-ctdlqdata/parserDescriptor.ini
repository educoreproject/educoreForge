# parserDescriptor.ini — forge-ctdlqdata self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
# standardName MUST be unique among enabled production bundles: 'CTDLQData' is distinct from 'CTDL' and 'CTDLASN'.
[parserDescriptor]
standardName=CTDLQData
displayName=Credential Transparency Description Language — Quantitative Data (CTDL-QData)
entryModule=forgeCtdlqdata.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
defaultSnapshot=01
