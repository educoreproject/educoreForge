# layerDescriptor.ini — the CEDS `des` layer: the Domain Entity Schema, Version 13 (lane DES, campaign cedsRichness-101226,
# 2026-10-12; TQ ruling 1: DES V13 comes in BESIDE the V14 ontology, as a separate block, every node stamped desVersion '13',
# linked to V14 properties by P + Global ID only). Read by lib/layer-framework (resolveLayer). The [layerDescriptor] header
# is required: the ini reader discards sectionless keys.
#
# layerVersion is DECLARED here and CROSS-CHECKED against the snapshot's layerSourceLocation (publishedVersion); the workbook
# does not state its own version, so the provenance record is the evidence (CEDS calls it "Version 13").
