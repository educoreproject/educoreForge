# layerDescriptor.ini — the CEDS `textRepair` layer: the declared source exception for the U+FFFD replacement characters in
# the CEDS V14 ontology (TQ ruling 3, 2026-10-12; README_sourceExceptions.md case 12). Repairs ride BESIDE the faithful
# text, taken from the CEDS IDS v14.0.0.0 reference data, with file, sha256 and line. The [layerDescriptor] header is required.
[layerDescriptor]
layerKey=textRepair
displayName=CEDS V14 text repairs (U+FFFD), from the CEDS IDS v14.0.0.0 reference data
entryModule=forgeTextRepairLayer.js
defaultSnapshot=01
sourceFileList=CEDS-IDS.sql,Populate-CEDS-Ref-Tables.sql
layerVersion=14.0.0.0
layerLabel=CedsTextRepairLayer
roundTripValidator=roundTripValidator.js
