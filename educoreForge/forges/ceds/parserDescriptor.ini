# parserDescriptor.ini — forge-ceds self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
[parserDescriptor]
standardName=CEDS
displayName=Common Education Data Standards (CEDS)
entryModule=forgeCeds.js
# roundTripValidator declares this bundle's uniform round-trip entry point (doctrine RT-13.1:
# declared, not sniffed). Added by the Round-Trip Perfection campaign Phase 3.5 (2026-08-04),
# which existed because its ABSENCE was a Phase 8 blocker: the RT-13 stage classified CEDS as
# declared-ABSENT and tolerated it, so the fleet's most-measured standard was the one standard
# that could not produce a verdict artifact. ACTIVE, NOT DORMANT: a stage-ON build WILL load and
# run this file against the materialized CEDS sub-graph and land its verdict with the build
# outputs. recipes/cedsOnlyRoundTrip.recipe.jsonc is this bundle's stage-ON build; CEDS has no
# stage-off base-only sibling, which is itself recorded in that recipe's header.
#
# NO EXPECTED LOSS IS STATED HERE, unlike the sif and edfi descriptors, and that is deliberate.
# CEDS's round trip has been enforced since 2026-08-02 by the R-1 in-build fidelity gate
# (apps/graph-builder/lib/build.js runCedsFidelityGate), which FAILS THE BUILD on loss and always
# on invention — but it persists no artifact, so no verdict-shaped number has ever existed to
# quote. Writing an expectation this bundle's validator has not yet earned would be exactly the
# tuning-toward-a-number the campaign exists to prevent. The measured figure lives in the Phase
# 3.5 DEVLOG and in the verdict itself.
#
# CEDS BEARS THE HIGHEST BAR IN THE FLEET, BY RULING. Its explicitly-omitted registry is EMPTY and
# forbidden to grow (TQ 2026-08-02, README_roundTripContract.md: if it is in the OWL, it has to
# come out of the graph). So roundTripClean here requires LITERAL zero content gap with no margin.
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
defaultSnapshot=01
# ---- HUB ROLE (SPEC-hubKitRole-082826.md §4.2, Phase 2a) --------------------------------------
# hubModule declares that this kit CAN be a hub; recipe.hubs decides whether it IS one in this build.
# BOTH are required, and the refusal semantics of the deleted forger registry (HUB_FORGE_BY_STANDARD)
# are preserved exactly: a recipe naming a hub whose kit declares no hubModule is REFUSED BY NAME
# (invariant I7), and a kit declaring hubModule that no recipe names simply derives no hub.
#
# THE PATH IS NOT A RENAME IN 2a, DELIBERATELY. cedsHubForge.js derives its moduleName from
# __filename and stamps it into HubDefinition.sourceProvenance, which is a BLOCK BYTE — so moving or
# renaming this file MOVES THE CEDS BLOCK ID (SPEC §3.3 [R2 F1], §4.9). Discovery replaces the
# registry here with the id held still; the provenance re-key is its own step (2b) with its own
# predicted diff, and the rename to hubCeds.js is 2c's.
hubModule=lib/cedsHubForge.js
# hubNamespace MOVES here; it does not copy. This is the ONE declared home of the hub's URI root in
# production code (invariant I8) — every card uri and HubDefinition.namespace is minted FROM it via
# the factory argument. A second production occurrence of this URL anywhere in the tree is a defect.
hubNamespace=https://w3id.org/EDUcore/CEDStandards/hub/
# source is a specific FILE within the snapshot directory (file-bound parser).
sourceFile=CEDS-Ontology.rdf
