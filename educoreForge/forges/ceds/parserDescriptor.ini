# parserDescriptor.ini — forge-ceds self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
[parserDescriptor]
standardName=CEDS
displayName=Common Education Data Standards (CEDS)
entryModule=forgeCeds.js
# roundTripValidator declares this bundle's uniform round-trip entry point (doctrine RT-13.1:
# declared, not sniffed). Added by the Round-Trip Perfection campaign Phase 3.5 (2026-08-04),
# which existed because its ABSENCE was a Phase 8 blocker: the RT-13 stage classified CEDS as
# declared-ABSENT and tolerated it, so the fleet's most-measured standard was the one standard
# that could not produce a verdict artifact. ACTIVE, NOT DORMANT: a stage-ON build WILL load and
# run this file against the materialized CEDS sub-graph and land its verdict with the build
# outputs. recipes/cedsOnlyRoundTrip.recipe.jsonc is this bundle's stage-ON build; CEDS has no
# stage-off base-only sibling, which is itself recorded in that recipe's header.
#
# NO EXPECTED LOSS IS STATED HERE, unlike the sif and edfi descriptors, and that is deliberate.
# CEDS's round trip has been enforced since 2026-08-02 by the R-1 in-build fidelity gate
# (fidelityGateModule below, run by apps/graph-builder/lib/build.js runDeclaredFidelityGate), which FAILS THE BUILD on loss and always
# on invention — but it persists no artifact, so no verdict-shaped number has ever existed to
# quote. Writing an expectation this bundle's validator has not yet earned would be exactly the
# tuning-toward-a-number the campaign exists to prevent. The measured figure lives in the Phase
# 3.5 DEVLOG and in the verdict itself.
#
# CEDS BEARS THE HIGHEST BAR IN THE FLEET, BY RULING. Its explicitly-omitted registry is EMPTY and
# forbidden to grow (TQ 2026-08-02, README_roundTripContract.md: if it is in the OWL, it has to
# come out of the graph). So roundTripClean here requires LITERAL zero content gap with no margin.
roundTripValidator=roundTripValidator.js
# anchorPrefixDeclaration (R5 S2) RETIRED 2026-10-22 (zeroBacklog lane D, D3-6): its one reader, the forge kit's hubAnchorValue,
# left with its last caller, the old SIF forge (codeAttic/forges/sif). It reached no node.
# fidelityGateModule (R5 S4, 2026-10-21) is this bundle's R-1 in-build fidelity gate: round-trip CEDS out of the materialized
# graph and fail the build on loss or invention. build.js runs the gate a recipe's standard declares and names no standard.
# Not a hub* key, for the reason above; read by build.js alone and reaches no node.
fidelityGateModule=lib/cedsFidelityGate.js
# edgeDefinitionDeclaration (R5 S7, 2026-10-21) is this hub's own definitions of its HAS_CEDS_<SLOT> edges, read by the
# schema-view finisher (graph-only member descriptions). Not a hub* key, for the reason above; reaches no forged node.
edgeDefinitionDeclaration=lib/cedsHubEdgeDefinitions.js
# roundTripVerbModule (R5 S9, 2026-10-21) is this bundle's operator verbs over a materialized graph: graphBuilder
# -roundTripCompile --standard=ceds (compile the graph back to the OWL and diff it against the source) and -roundTripGates
# --standard=ceds (the 46 fidelity gates). Read by actions.js alone; reaches no node.
roundTripVerbModule=lib/cedsRoundTripVerbs.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
defaultSnapshot=01
# ---- HUB ROLE (SPEC-hubKitRole-082826.md §4.2, Phase 2a) --------------------------------------
# hubModule declares that this kit CAN be a hub; recipe.hubs decides whether it IS one in this build.
# BOTH are required, and the refusal semantics of the deleted forger registry (HUB_FORGE_BY_STANDARD)
# are preserved exactly: a recipe naming a hub whose kit declares no hubModule is REFUSED BY NAME
# (invariant I7), and a kit declaring hubModule that no recipe names simply derives no hub.
#
# PHASE 2c: hubModule names hubCeds.js, the one-line injection against lib/hub-framework, and
# forges/ceds/lib/cedsHubForge.js is DELETED.
#
# THE ORDER OF THE THREE STEPS WAS THE WHOLE POINT, and it is worth keeping. In 2a the module was
# NOT renamed: cedsHubForge.js derived its moduleName from __filename and stamped it into
# HubDefinition.sourceProvenance, which is a BLOCK BYTE, so moving the file would have moved the CEDS
# block id and mixed a relocation in with a dispatch change. 2b re-keyed that stamp by controlled
# experiment (commit 4ce39b8) and PROVED the change moved exactly one line of the block. Only then
# could 2c move the code, because forgeModule is now DECLARED DATA in lib/cedsHubDeclaration.js
# rather than derived from whichever file happens to hold the derivation.
# I1' = e763404ea5864e2c9a9d4521b0887343e0c42bd5aa59565e2d2b1bba70dfb855
hubModule=hubCeds.js
# hubNamespace MOVES here; it does not copy. This is the ONE declared home of the hub's URI root in
# production code (invariant I8) — every card uri and HubDefinition.namespace is minted FROM it via
# the factory argument. A second production occurrence of this URL anywhere in the tree is a defect.
hubNamespace=https://w3id.org/EDUcore/CEDStandards/hub/
# hubBridgingModule (hub-neutral bridge lane R2, 2026-10-21): the HUB HALF of every bridge toward this hub, read only by
# lib/bridge-framework/hubBridgingLoader.js. The hub module never requires it, so it cannot move the forged hub output.
hubBridgingModule=lib/cedsHubBridging.js
# source is a specific FILE within the snapshot directory (file-bound parser).
sourceFile=CEDS-Ontology.rdf
# ---- LAYERS (lane DES, campaign cedsRichness-101226, 2026-10-12; COPPER_RIVER ruling Q1) ----------------------------
# layerNamespace is the ONE declared home of every CEDS layer id's root (the hubNamespace rule): a layer node's stableId is
# <layerNamespace><layerKey>/<layerVersionSlug>/<kind>/<natural id>. The layers themselves are declared by their own
# descriptors under layers/<layerKey>/ and built only when a recipe names them (capability is not activation).
layerNamespace=https://w3id.org/EDUcore/CEDStandards/layer/
