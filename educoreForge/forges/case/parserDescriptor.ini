# parserDescriptor.ini — forge-case self-description (the bundle IS its own registration; nextStandards wave 2 lane E, 2026-10-24).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). CASE is the July
# _source name, so the inventory oracle's name matches.
standardName=CASE
displayName=CASE 1.1 (CASE)
entryModule=forgeCase.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW snapshot directory and changes nothing until this line says so.
defaultSnapshot=01
sourceFile=imscasev1p1_openapi3_v1p0.yaml
