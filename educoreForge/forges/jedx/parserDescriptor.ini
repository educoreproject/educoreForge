# parserDescriptor.ini — forge-jedx self-description (the bundle IS its own registration; nextStandards-102326 lane B1, 2026-10-24).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). JEDx is the July
# _source name, so the inventory oracle's name matches (plan Q-N8).
standardName=JEDx
displayName=Jobs and Employment Data Exchange (JEDx)
entryModule=forgeJedx.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW snapshot directory and changes nothing until this line says so.
# 02 = the JEDx Open API Specification bundles (HROpen/APISpecifications @707ec7d); 01 (the July CSV) is a record only, never forged.
defaultSnapshot=02
# no sourceFile: the forge reads the snapshot DIRECTORY (four bundles, named in the openapi profile's sourceFileNameList), and the
# framework verifies every file SHA256SUMS lists
