# parserDescriptor.ini — forge-medbiq self-description (the bundle IS its own registration; nextStandards wave 3 lane I, 2026-10-25).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). MedBiquitous is the July
# _source name, so the inventory oracle's name matches.
standardName=MedBiquitous
displayName=MedBiquitous (AAMC health professions education standards)
entryModule=forgeMedbiq.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW snapshot directory and changes nothing until this line says so. Snapshot 01 is
# the held copy, a record only.
defaultSnapshot=02
# sourceFile is DELIBERATELY ABSENT: lib/xsd-forge reads the snapshot DIRECTORY, which the forger hands over when sourceFile is omitted.
