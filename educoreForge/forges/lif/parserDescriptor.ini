# parserDescriptor.ini — forge-lif self-description (the bundle IS its own registration; nextStandards-102326 lane C1, 2026-10-24).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). LIF is the July _source
# name, so the inventory oracle's name matches.
standardName=LIF
displayName=LIF 2.0 (LIF)
entryModule=forgeLif.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: 02 is the publisher's lif-core lif-schema.json; 01 (the held A4L export) is a record only.
defaultSnapshot=02
sourceFile=lif-schema.json
