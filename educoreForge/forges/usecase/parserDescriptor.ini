# parserDescriptor.ini — forge-usecase self-description (the bundle IS its own registration; useCaseForge-102926 Phase 1, 2026-10-29).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). Named by SHADOW_MEADOW 2026-10-29.
standardName=UseCase
displayName=EDUcore Enhanced Cockburn Use Cases (UseCase)
entryModule=forgeUsecase.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW snapshot directory and changes nothing until this line says so (REVISION 1, R1).
defaultSnapshot=01
# no sourceFile: the forge reads the snapshot DIRECTORY (cases/, formats/, resolutionRegistry.json), and the framework verifies every file SHA256SUMS lists
