# parserDescriptor.ini — forge-sif260928 self-description (the bundle IS its own registration).
# The [parserDescriptor] section header is REQUIRED: qtools-config-file-processor discards
# sectionless keys, so a mistyped header makes every key in this file invisible at once.
[parserDescriptor]
# DELIBERATELY DISTINCT from the incumbent's 'SIF' so both bundles coexist in one graph (SPEC §9
# A8, following the pesc260805 precedent). standardName is every node's _source; G-UNIQUE refuses
# two bundles sharing one. It must equal the declaration's standardSource exactly (G-SOURCE).
standardName=SIF260928
displayName=Schools Interoperability Framework (SIF) - sif260928 rebuild
entryModule=forgeSif260928.js
# sourceFile names the ONE file the loader reads; the forger hands the forge <snapshot>/<sourceFile>,
# so the framework verifies exactly this file against SHA256SUMS.
sourceFile=ImplementationSpecification_031326.tsv
# roundTripValidator is the regeneration proof built in phase A6: the graph regenerates sourceFile
# byte for byte (SPEC §9 A29). A declared validator must load and export validate, or every build
# is refused (round-trip-stage.js).
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new snapshot directory changes nothing until this line flips.
defaultSnapshot=01
