# parserDescriptor.ini — forge-eduapi self-description (the bundle IS its own registration; nextStandards wave 2 lane F, 2026-10-24).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). EduAPI is the July
# _source name (GOLD_EVAL_260718 inventory), so the inventory oracle's name matches.
standardName=EduAPI
displayName=EduAPI 1.0 (EduAPI)
entryModule=forgeEduapi.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW snapshot directory and changes nothing until this line says so.
# 01 is the May Candidate Final copy, record only; 02 is the Final fetched 2026-10-24.
defaultSnapshot=02
sourceFile=eduapi_v1p0_openapi3.json
