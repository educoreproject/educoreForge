# parserDescriptor.ini — forge-clr self-description (the bundle IS its own registration; nextStandards-102326 wave 2 lane D1, 2026-10-24).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). CLR is the July _source name,
# so the inventory oracle's name matches.
standardName=CLR
displayName=CLR 2.0 (CLR)
entryModule=forgeClr.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW snapshot directory and changes nothing until this line says so.
defaultSnapshot=01
sourceFile=clr_v2p0_oas.json
