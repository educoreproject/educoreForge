# parserDescriptor.ini — forge-edfi self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
[parserDescriptor]
standardName=EdFi
displayName=Ed-Fi Data Standard (EdFi)
# entryModule names the round-trip-campaign forge, which took this manifest name at the Phase 5
# closeout (2026-08-04) when the incumbent CSV-crosswalk forge was REMOVED from HEAD per R-WO-2.
# The filename is unchanged across the swap; the module behind it is a clean reimplementation
# from Ed-Fi's canonical MetaEd source. Git history holds the incumbent.
entryModule=forgeEdfi.js
# roundTripValidator declares this bundle's uniform round-trip entry point (doctrine RT-13.1:
# declared, not sniffed; declared in forge-edfi Phase 4, the phase that also taught the
# graphBuilder the stage). Declared-but-missing is a refusal by name (RT-13.3), never a
# downgrade to absent. A stage-ON edfi build now produces a real verdict: the Phase 5 closeout
# flipped entryModule and defaultSnapshot TOGETHER, closing the Phase 4->5 transitional window
# in which a stage-ON build refused honestly at snapshot intake.
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until
# this line says so.
#
# VERSION-FOLLOWING (doctrine RT-12): a new upstream Ed-Fi version is a NEW snapshot directory,
# acquired by the recipe in its README_PROVENANCE.md, checksummed into its SHA256SUMS, and
# committed (license permitting — the MetaEd bytes are gitignored). Nothing changes until this
# pin is deliberately flipped to it. On the flip, run the round-trip verdict against the new
# snapshot BEFORE anything downstream consumes it; the diff between the two snapshots'
# re-emissions is the changelog.
#
# Snapshots 01-03 (the incumbent forge's CSV-crosswalk snapshot and the two blinded evaluation
# rigs derived from it) were REMOVED at the Phase 5 closeout with the forge that read them; the
# evaluation REPORT documents in system/management/zNotesPlansDocs/ remain as the record, and
# git history holds the bytes.
defaultSnapshot=04
