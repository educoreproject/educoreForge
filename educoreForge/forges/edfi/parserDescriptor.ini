# parserDescriptor.ini — forge-edfi self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
[parserDescriptor]
standardName=EdFi
displayName=Ed-Fi Data Standard (EdFi)
entryModule=forgeEdfi.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
#
# Snapshot 02 EXISTS but is deliberately NOT pinned: it is the blinded, 98-row BLIND-EVALUATION
# snapshot (every CEDS* column empty — see 02/standardSourceLocation), used 2026-08-02 to score the
# inference bridge against Ed-Fi's own authored crosswalk. It is NOT a version of Ed-Fi and must
# never reach a golden. To re-run that evaluation, pin this to 02, build
# recipes/cedsEdfiBlind.recipe.jsonc with --rebridge=edfi, then PIN IT BACK TO 01.
defaultSnapshot=01
