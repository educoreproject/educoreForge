# parserDescriptor.ini — forge-sif self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
[parserDescriptor]
standardName=SIF
displayName=Schools Interoperability Framework (SIF)
entryModule=forgeSif.js
# roundTripValidator declares this bundle's uniform round-trip entry point (doctrine RT-13.1:
# declared, not sniffed). ACTIVE, NOT DORMANT: the graphBuilder round-trip STAGE is LIVE as of the
# forge-edfi campaign's Phase 4 (commit 2013aa3), so a stage-ON build WILL load and run this file
# against the materialized SIF sub-graph and land its verdict with the build outputs.
# recipes/sifOnlyRoundTrip.recipe.jsonc is this bundle's stage-ON build; recipes/sifOnly is the
# stage-off sibling. Declared-but-missing is a refusal by name (RT-13.3) on EVERY build, stage on
# or off — never a downgrade to absent. Expect inventedTotal 0 (the doctrine's hard line, RT-6)
# and lostTotal 15,458 — the ONE named enrichment-backlog label `fieldCharacteristics` — so
# roundTripClean is honestly false until that enrichment lands.
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
# VERSION-FOLLOWING (doctrine RT-12): a new upstream SIF version is a NEW directory under
# assets/standardSourceData/, acquired and checksummed per that directory's README_PROVENANCE.md
# (SIF's canonical source is the SPREADSHEET John Lovell authors, ruling R-SF-6; the published
# XSDs are generated downstream from it). Nothing downstream changes until this pin is
# deliberately flipped; when it flips, run the round-trip verdict against the new snapshot FIRST
# — the diff between the two snapshots' re-emissions is the changelog.
defaultSnapshot=01
