# parserDescriptor.ini — forge-sif self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
[parserDescriptor]
standardName=SIF
displayName=Schools Interoperability Framework (SIF)
entryModule=forgeSif.js
# roundTripValidator declares this bundle's uniform round-trip entry point (doctrine RT-13.1:
# declared, not sniffed). ACTIVE, NOT DORMANT: the graphBuilder round-trip STAGE is LIVE as of the
# forge-edfi campaign's Phase 4 (commit 2013aa3), so a stage-ON build WILL load and run this file
# against the materialized SIF sub-graph and land its verdict with the build outputs.
# recipes/sifOnlyRoundTrip.recipe.jsonc is this bundle's stage-ON build; recipes/sifOnly is the
# stage-off sibling. Declared-but-missing is a refusal by name (RT-13.3) on EVERY build, stage on
# or off — never a downgrade to absent.
#
# EXPECT inventedTotal 0 (the doctrine's hard line, RT-6) AND lostTotal 0, roundTripClean TRUE.
#
# ⚠ CORRECTED 2026-08-29 (hub-kit-role Phase 3, RULING FJ-P3-3). THESE LINES PREDICTED A LOSS THAT
# NO LONGER OCCURS, AND THE NUMBER THEY NAMED IS NOW THE COUNT OF THE THING THAT FIXED IT. They read:
# "Expect inventedTotal 0 ... and lostTotal 15,458 — the ONE named enrichment-backlog label
# `fieldCharacteristics` — so roundTripClean is honestly false UNTIL THAT ENRICHMENT LANDS."
# The enrichment LANDED, in commit 4b6254d ("forge-sif Phase 4: the CHARACTERISTICS enrichment -
# verbatim carry closes the 15,458-statement fieldCharacteristics backlog ... ROUND-TRIP CLEAN:
# 97,888 of 97,888, LOST 0, INVENTED 0"), and this comment — written earlier in commit 33e3afe —
# was never updated behind it. MEASURED on the Phase 3 I9 build: lostTotal 0, contentGapTotal 0,
# roundTripClean true, and EXACTLY 15,458 of the 15,620 SifField nodes carry the `characteristics`
# property, numerically identical to the loss the old text predicted.
# A successor reading the old text would have expected 15,458 and measured 0. The 0 is right.
#
# ⚠ AND "CLEAN" IS NOT "COMPLETE" — the validator says so itself, at length, in its verdict's
# semanticValidationLimit: lostTotal 0 means fidelity TO THE INGESTED SNAPSHOT, never completeness of
# the SIF model. The flattened export gives NO ROW to any element that has element children — 6,586
# container paths across 153 of the 159 objects, 1,887 of them maxOccurs="unbounded" in the generated
# XSD — so this graph cannot distinguish a single-valued element from a repeating collection wherever
# those declarations apply, because the source never stated it.
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
# VERSION-FOLLOWING (doctrine RT-12): a new upstream SIF version is a NEW directory under
# assets/standardSourceData/, acquired and checksummed per that directory's README_PROVENANCE.md
# (SIF's canonical source is the SPREADSHEET John Lovell authors, ruling R-SF-6; the published
# XSDs are generated downstream from it). Nothing downstream changes until this pin is
# deliberately flipped; when it flips, run the round-trip verdict against the new snapshot FIRST
# — the diff between the two snapshots' re-emissions is the changelog.
defaultSnapshot=01
