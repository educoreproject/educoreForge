# parserDescriptor.ini — forge-ctdlasn self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
# standardName MUST be unique among enabled production bundles: 'CTDLASN' is distinct from 'CTDL'.
[parserDescriptor]
standardName=CTDLASN
displayName=Credential Transparency Description Language — Achievement Standards Network (CTDL-ASN)
entryModule=forgeCtdlasn.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
defaultSnapshot=01
# source is a specific FILE within the snapshot directory (file-bound parser). The recreation's forger
# resolveBundle REQUIRES sourceFile to compute the bundle's defaultSource (the incumbent passed the
# snapshot DIRECTORY; the parser accepts either — directory or file — and finds ctdlasn.json inside).
# Added to match the ceds/ctdl/lif descriptors in the new tree.
sourceFile=ctdlasn.json
