# parserDescriptor.ini — forge-sedm self-description (the bundle IS its own registration; nextStandards-102326 wave 2, lane G, 2026-10-24).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). SEDM is the July _source name.
standardName=SEDM
displayName=SEDM (Special Education Data Model), working documents
entryModule=forgeSedm.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a published SEDM artefact is a NEW snapshot directory and changes nothing until this line says so.
defaultSnapshot=01
# no sourceFile: the forge reads the snapshot DIRECTORY (the CSV and the structures JSON), and the framework verifies every file SHA256SUMS lists
