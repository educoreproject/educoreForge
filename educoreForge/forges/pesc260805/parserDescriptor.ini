# parserDescriptor.ini — forge-pesc260805 self-description (the bundle IS its own registration).
# The [parserDescriptor] section header is REQUIRED — qtools-config-file-processor DISCARDS
# sectionless keys, so a mistyped header makes every key in this file invisible at once
# (forger.js:182-192 refuses by name when that happens).
[parserDescriptor]
# D-6 (supervisor ruling, pescForgeRebuild-080526): deliberately DISTINCT from the incumbent's
# 'PESC' so both bundles can coexist in one graph while the rebuild earns the incumbent's
# retirement on evidence. Do not change.
standardName=PESC260805
displayName=Postsecondary Electronic Standards Council (PESC) - pesc260805 rebuild
entryModule=forgePesc260805.js
# sourceFile is DELIBERATELY ABSENT: this is a directory-source bundle — the parser demands the
# snapshot DIRECTORY (the 64-file XSD aggregate), which forger.js hands over when sourceFile is
# omitted.
# roundTripValidator — DECLARED IN PHASE 5 (session CRYSTAL_STREAM, 2026-08-06), and only after the
# module loaded clean and produced a verdict whose numbers were trusted. RT-13.3: a declared
# validator that does not exist or does not load REFUSES EVERY BUILD by name, stage on or off, so
# this line is never added speculatively.
# THE VERDICT IT PRODUCES - CURRENT, measured 2026-08-07 (VIOLET_STONE) from a stage-ON build:
#   reproduced 173,216 - invented 0 - lost 0 - contentGap 0 - explicitlyOmitted 0
#   whitespaceOnlyDifference 0 - syntheticReproducible true FOR S-1 IDENTITY ONLY (109 definitions;
#   S-1c's children and S-2 are unchecked, and that qualification travels with the boolean).
# lostTotal above zero is TOLERATED and logged; inventedTotal above zero FAILS a build.
# LOST 0 MEANS ZERO LOSS IN THE DIMENSIONS THE COMPARATOR MODELS. Type-reference NAMESPACE
# (canonicalTypeRef strips the prefix - R-ID-1's fusion surviving in the object space, the most
# serious residue), ATTRIBUTE ORDER, and the 2nd..nth xs:documentation literal are unmodelled and
# CANNOT register as loss. See README_KnownIssues.md before restating the zero anywhere.
#
# SUPERSEDED TEXT, PRESERVED BECAUSE NOTHING IS DELETED (work order standing rule 4). From Phase 5
# until 2026-08-07 the three lines above read:
#   "The verdict it produces: invented 0 (proven non-vacuous - three graph-row mutations each drove
#    it 0->1), lost 293, whitespaceOnlyDifference 0, syntheticReproducible true for S-1 identity
#    only."
# THE 293 WAS TRUE AT PHASE 5 AND WAS CLOSED BY PHASE 6.5'S EMITTER COMPLETION - checked rather
# than assumed, by counting the emitted output against the corpus: xs:group ref declared 282 and
# emitted 282, xs:any 25 and 25. It was NOT laundered into explicitlyOmitted, which also reads 0.
# (The raw source count for xs:group ref is 283 because ONE IS INSIDE AN XML COMMENT. Any corpus
# count must state whether comments were stripped and by what instrument.)
# Left standing, "lost 293" read as a CURRENT description of the shipped verdict and would have
# been quoted as one.
roundTripValidator=roundTripValidator.js
# defaultSnapshot pins the 2026-08-05 aggregate (assets/standardSourceData/01/, 64 artifacts,
# manifest.json naming every constituent at its real published version). Dropping a new snapshot
# changes NOTHING until this pin deliberately flips.
defaultSnapshot=01
