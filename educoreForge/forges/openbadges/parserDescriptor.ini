# parserDescriptor.ini — forge-openbadges self-description (the bundle IS its own registration; nextStandards-102326 lane A1, 2026-10-23).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). OpenBadges is the July
# _source name, so the inventory oracle's name matches (plan Q-N8).
standardName=OpenBadges
displayName=Open Badges 3.0 (OpenBadges)
entryModule=forgeOpenbadges.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW snapshot directory and changes nothing until this line says so.
defaultSnapshot=01
sourceFile=ob_v3p0_oas.json
