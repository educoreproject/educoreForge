# parserDescriptor.ini — forge-ctdl self-description (pairwiseVersionSwitching; ctdlHub-101926 P1). This bundle IS its
# own registration: the discovery loader composes the roster from these descriptors. The [parserDescriptor] section
# header is required — qtools-config-file-processor drops sectionless keys.
#
# A PORT of the July 2026 attic forge (codeAttic/cli/parserLib/forge-ctdl) onto the Forge Framework, judged against the
# July oracle GOLD_EVAL_260718 (apps/graph-builder/tools/oracleDiff.js; allowance dataStores/ctdlHub_101926/oracle/).
# roundTripValidator is DECLARED, not sniffed (RT-13.1); recipes/ctdlOnlyRoundTrip.recipe.jsonc runs it.
[parserDescriptor]
standardName=CTDL
displayName=Credential Transparency Description Language (CTDL)
entryModule=forgeCtdl.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW directory under assets/standardSourceData/ and changes
# nothing until this line says so (plan P9 version-follow).
defaultSnapshot=01
sourceFile=ctdl-schema.json
