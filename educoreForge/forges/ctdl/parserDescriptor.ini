# parserDescriptor.ini — forge-ctdl self-description (pairwiseVersionSwitching; ctdlHub-101926 P1). This bundle IS its
# own registration: the discovery loader composes the roster from these descriptors. The [parserDescriptor] section
# header is required — qtools-config-file-processor drops sectionless keys.
#
# A PORT of the July 2026 attic forge (codeAttic/cli/parserLib/forge-ctdl) onto the Forge Framework, judged against the
# July oracle GOLD_EVAL_260718 (apps/graph-builder/tools/oracleDiff.js; allowance dataStores/ctdlHub_101926/oracle/).
# roundTripValidator is DECLARED, not sniffed (RT-13.1); recipes/ctdlOnlyRoundTrip.recipe.jsonc runs it.
[parserDescriptor]
standardName=CTDL
displayName=Credential Transparency Description Language (CTDL)
entryModule=forgeCtdl.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new release is a NEW directory under assets/standardSourceData/ and changes
# nothing until this line says so (plan P9 version-follow).
# P10 (2026-10-21, INDIGO_CASCADE) moved the pin 01 -> 02 deliberately: snapshot 02 is the release credreg.net states as
# current (see assets/standardSourceData/02/README_PROVENANCE.md and CHANGES-ctdlFamily-01to02-102126.md). 01 stays on disk.
defaultSnapshot=02
sourceFile=ctdl-schema.json
# ---- HUB (ctdlHub-101926 P4) ------------------------------------------------------------------------------------------
# hubModule declares that the CTDL kit CAN be a hub (hubCtdl.js, the one-line injection against lib/hub-framework). It is
# capability, not activation: a build mints the CTDL hub only when its recipe names { standard: 'ctdl' } in hubs
# (recipes/ctdlHub.recipe.jsonc). A recipe that does not — ctdlOnly, ctdlOnlyRoundTrip — builds the same standardBase block
# as before these two keys existed.
hubModule=hubCtdl.js
# hubNamespace: the ONE declared home of the CTDL hub's URI root in production code (invariant I8). Every card IRI and
# HubDefinition.namespace is minted FROM it via the factory argument; the trailing slash is load-bearing (the version
# segment is appended directly). A second production occurrence of this URL anywhere in the tree is a defect.
hubNamespace=https://w3id.org/EDUcore/CTDL/hub/
