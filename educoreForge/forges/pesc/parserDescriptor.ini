# parserDescriptor.ini — forge-pesc self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
[parserDescriptor]
standardName=PESC
displayName=Postsecondary Electronic Standards Council (PESC)
entryModule=forgePesc.js
# roundTripValidator declares this bundle's uniform round-trip entry point (doctrine RT-13.1:
# declared, not sniffed). DORMANT: the graphBuilder round-trip STAGE is not yet wired — it lands
# via the forge-edfi campaign's RT-13 builder work; until then this line is a declaration the
# builder does not yet read. From the day the stage lands, declared-but-missing is a refusal by
# name (RT-13.3), never a downgrade to absent.
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
# Version-following (RT-12): a new upstream PESC version is a NEW directory under
# assets/standardSourceData/, acquired and checksummed per that directory's README_PROVENANCE.md.
# Nothing downstream changes until this pin is deliberately flipped; when it flips, run the
# round-trip verdict against the new snapshot FIRST — the diff between the two snapshots'
# re-emissions is the changelog.
defaultSnapshot=01
