# parserDescriptor.ini — forge-pescld self-description (the bundle IS its own registration; zeroBacklog lane C1, 2026-10-22).
# The [parserDescriptor] section header is REQUIRED: the ini reader discards sectionless keys.
[parserDescriptor]
# standardName is every node's _source and must equal the declaration's standardSource exactly (G-SOURCE). PESCLD, not PESC:
# the retired attic forge owned 'PESC' (TQ naming ruling 2026-10-20).
standardName=PESCLD
displayName=PESC College Transcript in JSON-LD (PESC_LD)
entryModule=forgePescld.js
roundTripValidator=roundTripValidator.js
# defaultSnapshot is an explicit pin: a new package version is a NEW snapshot directory and changes nothing until this line says so.
defaultSnapshot=01
# no sourceFile: the forge reads the snapshot DIRECTORY (ten CSVs), and the framework verifies every file SHA256SUMS lists
