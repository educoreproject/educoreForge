# parserDescriptor.ini — forge-dctap self-description (BINDING spec §3.5, pairwiseVersionSwitching).
# This bundle IS its own registration: the discovery loader composes the roster from these
# descriptors; the central standard-registry is deleted. The [parserDescriptor] section header
# is required — qtools-config-file-processor drops sectionless keys.
[parserDescriptor]
standardName=DCTAP
displayName=Dublin Core Tabular Application Profiles (DCTAP)
entryModule=forgeDctap.js
# defaultSnapshot is an explicit pin (spec §15-6): dropping a new snapshot changes NOTHING until this line says so.
defaultSnapshot=01
# source is a specific FILE within the snapshot directory. The recreation's forger resolveBundle
# REQUIRES sourceFile to compute the bundle's defaultSource (added to match the ceds/ctdl/ctdlasn/lif
# descriptors in the new tree; the incumbent passed the snapshot DIRECTORY).
sourceFile=dctap-elements.jsonld
